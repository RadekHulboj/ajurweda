server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Obsługa Angular SPA routing
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        # serwowanie statycznych assetów
        alias /usr/share/nginx/html/assets/;
    }

    error_page 404 /index.html;
}
