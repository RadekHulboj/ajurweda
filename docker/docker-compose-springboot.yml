version: '3.8'

services:
  angular-app:
    build:
      context: ../../ajurweda
      dockerfile: ./docker/Dockerfile.angular
    ports:
      - "4200:4200"
    volumes:
      - ../../ajurweda:/usr/src/app
    command: >
      sh -c "npm install &&
             ng serve --host 0.0.0.0 --disable-host-check"

  ayurveda-server:
    image: ayurveda-server
    ports:
      - "8080:8080"
    environment:
      # Dodaj zmienne środowiskowe, jeśli są wymagane w aplikacji Spring Boot
      SPRING_PROFILES_ACTIVE: "prod"
